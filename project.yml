name: Commissary
packages:
  Alamofire:
    url: https://github.com/seanmarcusross-hue/Alamofire
    revision: eebc9adac38a4f09deb55753419c2c97e07aca67
options:
  bundleIdPrefix: com.commissary
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.2"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  Commissary:
    type: application
    platform: iOS
    sources:
      - path: Commissary
    resources:
      - path: PrivacyInfo.xcprivacy
    dependencies:
      - package: Alamofire
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.commissary.larder
        PRODUCT_NAME: Commissary
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_CFBundleDisplayName: Chickomissar
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
        INFOPLIST_KEY_NSCameraUsageDescription: Commissary uses the camera to scan product barcodes so you can add tins to your use-soon ladder with the correct best-before date.
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.food-and-drink
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0.0"
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_STYLE: Automatic
  CommissaryTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CommissaryTests
    dependencies:
      - target: Commissary
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.commissary.larder.tests
        GENERATE_INFOPLIST_FILE: YES
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        SWIFT_VERSION: "6.2"
        SWIFT_STRICT_CONCURRENCY: complete
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Commissary.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Commissary"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGN_STYLE: Automatic
schemes:
  Commissary:
    build:
      targets:
        Commissary: all
        CommissaryTests: [test]
    test:
      targets:
        - CommissaryTests
